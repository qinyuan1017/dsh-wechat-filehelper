<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="dsh-wechat-filehelper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#111a30"/>
      <stop offset="100%" stop-color="#0d2419"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07C160"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#07C160" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#07C160" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="220" fill="url(#glow)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="80" y="112" fill="#6ee7a7" font-size="17" letter-spacing="4" font-weight="600">DEEPSEEK HARNESS PLUGIN</text>
    <text x="80" y="180" fill="#ffffff" font-size="54" font-weight="700">dsh-wechat-filehelper</text>
    <text x="80" y="228" fill="#9fb0c9" font-size="23">Say it once. The file lands in your WeChat.</text>
    <text x="80" y="264" fill="#6b7d96" font-size="19">扫一次码 · 之后一句「发我微信」就够 · 纯 HTTP，不开浏览器</text>
  </g>

  <g transform="translate(985 150)">
    <circle r="74" fill="#07C160" opacity="0.12"/>
    <circle r="58" fill="#07C160" opacity="0.18"/>
    <path d="M-26 -30 L34 -6 L-4 4 L-14 32 L-22 4 Z" fill="url(#accent)"/>
    <circle cx="46" cy="38" r="7" fill="#4ade80"/>
  </g>

  <rect x="0" y="312" width="1200" height="8" fill="url(#accent)" opacity="0.85"/>
</svg>
