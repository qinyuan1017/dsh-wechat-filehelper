<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="flow">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151d31"/>
      <stop offset="100%" stop-color="#101725"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3f5473"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="#0a0f1e"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect x="40" y="96" width="240" height="108" rx="14" fill="url(#card)" stroke="#24314c"/>
      <text x="64" y="134" fill="#6ee7a7" font-size="13" letter-spacing="2">YOU</text>
      <text x="64" y="164" fill="#ffffff" font-size="19" font-weight="600">「发我微信」</text>
      <text x="64" y="188" fill="#7d8ea8" font-size="14">一句话，没有第二步</text>
    </g>

    <line x1="288" y1="150" x2="352" y2="150" stroke="#3f5473" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="360" y="96" width="248" height="108" rx="14" fill="url(#card)" stroke="#24314c"/>
      <text x="384" y="134" fill="#7dd3fc" font-size="13" letter-spacing="2">AGENT</text>
      <text x="384" y="164" fill="#ffffff" font-size="19" font-weight="600">找到文件 + 调用工具</text>
      <text x="384" y="188" fill="#7d8ea8" font-size="14">不知道哪个就列候选</text>
    </g>

    <line x1="616" y1="150" x2="680" y2="150" stroke="#3f5473" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="688" y="96" width="248" height="108" rx="14" fill="url(#card)" stroke="#24314c"/>
      <text x="712" y="134" fill="#fbbf24" font-size="13" letter-spacing="2">PLAIN HTTP</text>
      <text x="712" y="164" fill="#ffffff" font-size="19" font-weight="600">512KB 分片上传</text>
      <text x="712" y="188" fill="#7d8ea8" font-size="14">串行限速，避开风控</text>
    </g>

    <line x1="944" y1="150" x2="1008" y2="150" stroke="#3f5473" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="1016" y="96" width="148" height="108" rx="14" fill="#07281a" stroke="#0e7a45"/>
      <text x="1040" y="134" fill="#4ade80" font-size="13" letter-spacing="2">WECHAT</text>
      <text x="1040" y="164" fill="#ffffff" font-size="19" font-weight="600">你手机</text>
      <text x="1040" y="188" fill="#6b9e82" font-size="14">700ms</text>
    </g>

    <text x="40" y="48" fill="#6b7d96" font-size="14" letter-spacing="3">ONE REQUEST, NO BROWSER</text>
  </g>
</svg>
